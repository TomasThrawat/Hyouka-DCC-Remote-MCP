name: dcc-probe

on:
  push:
    paths:
      - ".dcc-probe-trigger"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner probe
        run: |
          set -euxo pipefail
          echo "runner-ok"
          python3 --version
          uname -a
