name: dcc-live2

on:
  push:
    paths:
      - ".dcc-live2-trigger"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: advice.defaultBranchName
      GIT_CONFIG_VALUE_0: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate live runtime script
        run: bash -n scripts/live-runtime.sh

      - name: Start real DCC runtime
        run: bash scripts/live-runtime.sh
