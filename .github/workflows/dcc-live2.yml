name: dcc-live2

permissions:
  contents: write

on:
  push:
    paths:
      - ".dcc-live2-trigger"
  workflow_dispatch: {}

jobs:
  runtime:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: advice.defaultBranchName
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Start real DCC runtime
        run: bash scripts/live-runtime.sh
