name: dcc-build-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python
        run: |
          set -euxo pipefail
          python3 -m py_compile auth_proxy.py
          python3 -m py_compile blender/entrypoint.py
          python3 -m py_compile krita/entrypoint.py

      - name: Build Blender image
        run: docker build -f blender/Dockerfile -t hyouka-blender-mcp:test .

      - name: Build Krita image
        run: docker build -f krita/Dockerfile -t hyouka-krita-mcp:test .
