name: DCC Live v2

"on":
  workflow_dispatch: {}
  push:
    paths:
      - ".dcc-live-v2-trigger"

permissions:
  contents: write

concurrency:
  group: dcc-live-v2
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ca-certificates curl git python3 python3-venv python3-pip xz-utils             openssh-client xvfb dbus-x11 krita             libx11-6 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0             libgl1 libglu1-mesa libsm6 libice6 libdbus-1-3             libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-render-util0             libxcb-shape0 libxcb-randr0 libxcb-image0 libxcb-util1             libxkbcommon-x11-0 libegl1 fonts-dejavu
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          python3 -m venv "$RUNNER_TEMP/dcc-venv"
          "$RUNNER_TEMP/dcc-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/dcc-venv/bin/pip" install             "fastmcp>=2,<4" "httpx>=0.27,<1"             "aiohttp>=3.11,<4" "PyJWT[crypto]>=2.9,<3"
          mkdir -p "$RUNNER_TEMP/dcc-python"
          "$RUNNER_TEMP/dcc-venv/bin/python" -m pip install             --target "$RUNNER_TEMP/dcc-python"             "dcc-mcp-blender==0.2.9"

      - name: Install Blender
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 5 --retry-all-errors             "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"             -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install Krita MCP plugin
        run: |
          set -euxo pipefail
          REF="5019f58852176aeeb11805126360ff749cd70dce"
          mkdir -p "$HOME/.local/share/krita/pykrita/kritamcp" "$HOME/.config"
          curl -fL --retry 5 --retry-all-errors             "https://raw.githubusercontent.com/nanayax3/krita-mcp/$REF/krita-plugin/kritamcp/__init__.py"             -o "$HOME/.local/share/krita/pykrita/kritamcp/__init__.py"
          curl -fL --retry 5 --retry-all-errors             "https://raw.githubusercontent.com/nanayax3/krita-mcp/$REF/krita-plugin/kritamcp.desktop"             -o "$HOME/.local/share/krita/pykrita/kritamcp.desktop"
          cat > "$HOME/.config/kritarc" <<'EOF'
          [python]
          enable_kritamcp=true
          EOF

      - name: Start Blender
        run: |
          set -euo pipefail
          export DCC_PYTHON_PATH="$RUNNER_TEMP/dcc-python"
          export DCC_PROXY_PYTHON="$RUNNER_TEMP/dcc-venv/bin/python"
          export PORT=10000
          export DCC_MCP_INNER_PORT=10002
          "$RUNNER_TEMP/blender/blender"             --background             --python "$GITHUB_WORKSPACE/blender/entrypoint.py"             > "$RUNNER_TEMP/blender.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/blender.pid"
          for _ in $(seq 1 120); do
            grep -q 'MCP_URL=' "$RUNNER_TEMP/blender.log" && break
            kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null || {
              cat "$RUNNER_TEMP/blender.log"
              exit 1
            }
            sleep 1
          done
          grep -q 'MCP_URL=' "$RUNNER_TEMP/blender.log"

      - name: Start Krita
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export PORT=10001
          export DCC_MCP_INNER_PORT=10003
          export DCC_PROXY_PYTHON="$RUNNER_TEMP/dcc-venv/bin/python"
          python3 "$GITHUB_WORKSPACE/krita/entrypoint.py"             > "$RUNNER_TEMP/krita.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/krita.pid"
          for _ in $(seq 1 150); do
            grep -q 'KRITA_MCP_URL=' "$RUNNER_TEMP/krita.log" && break
            kill -0 "$(cat "$RUNNER_TEMP/krita.pid")" 2>/dev/null || {
              cat "$RUNNER_TEMP/krita.log"
              exit 1
            }
            sleep 1
          done
          grep -q 'KRITA_MCP_URL=' "$RUNNER_TEMP/krita.log"

      - name: Verify internal MCP
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dcc-venv/bin/python" - <<'PY'
          import asyncio
          from fastmcp import Client

          async def check(url, label):
              async with Client(url) as client:
                  tools = await client.list_tools()
                  print(label + "_TOOLS=" + str(len(tools)))
                  if not tools:
                      raise RuntimeError(label + " returned empty tools/list")

          async def main():
              await check("http://127.0.0.1:10002/mcp", "BLENDER")
              await check("http://127.0.0.1:10003/mcp", "KRITA")

          asyncio.run(main())
          PY

      - name: Create public HTTPS tunnels
        run: |
          set -euo pipefail
          ssh -T -N             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ExitOnForwardFailure=yes             -o ServerAliveInterval=30             -o ServerAliveCountMax=3             -R 80:localhost:10000             nokey@localhost.run             > "$RUNNER_TEMP/blender-tunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/blender-tunnel.pid"

          ssh -T -N             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ExitOnForwardFailure=yes             -o ServerAliveInterval=30             -o ServerAliveCountMax=3             -R 80:localhost:10001             nokey@localhost.run             > "$RUNNER_TEMP/krita-tunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/krita-tunnel.pid"

          for _ in $(seq 1 90); do
            B="$(grep -Eo 'https://[A-Za-z0-9.-]+' "$RUNNER_TEMP/blender-tunnel.log" | head -1 || true)"
            K="$(grep -Eo 'https://[A-Za-z0-9.-]+' "$RUNNER_TEMP/krita-tunnel.log" | head -1 || true)"
            if [ -n "$B" ] && [ -n "$K" ]; then break; fi
            kill -0 "$(cat "$RUNNER_TEMP/blender-tunnel.pid")" 2>/dev/null || {
              cat "$RUNNER_TEMP/blender-tunnel.log"
              exit 1
            }
            kill -0 "$(cat "$RUNNER_TEMP/krita-tunnel.pid")" 2>/dev/null || {
              cat "$RUNNER_TEMP/krita-tunnel.log"
              exit 1
            }
            sleep 2
          done

          test -n "$B"
          test -n "$K"
          echo "BLENDER_MCP_URL=$B/mcp" >> "$GITHUB_ENV"
          echo "KRITA_MCP_URL=$K/mcp" >> "$GITHUB_ENV"

      - name: Verify public endpoints are protected
        run: |
          set -euo pipefail
          S1="$(curl -sS -o "$RUNNER_TEMP/b1.txt" -w '%{http_code}'             -X POST "$BLENDER_MCP_URL"             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}' || true)"
          S2="$(curl -sS -o "$RUNNER_TEMP/k1.txt" -w '%{http_code}'             -X POST "$KRITA_MCP_URL"             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}' || true)"
          test "$S1" = "401"
          test "$S2" = "401"

      - name: Publish live endpoint metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          now = dt.datetime.now(dt.timezone.utc)
          expires = now + dt.timedelta(hours=5)

          for provider in ("blender", "krita"):
              url = os.environ[provider.upper() + "_MCP_URL"]
              Path("runtime/" + provider + "-endpoint.json").write_text(
                  json.dumps({
                      "url": url,
                      "updatedAt": now.isoformat(),
                      "expiresAt": expires.isoformat(),
                      "provider": provider + "-mcp"
                  }, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/blender-endpoint.json runtime/krita-endpoint.json
          git commit -m "chore: publish live DCC MCP endpoints [skip ci]"
          git push origin HEAD:main

      - name: Keep DCC runtime alive
        run: |
          set -euo pipefail
          while true; do
            kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null || exit 1
            kill -0 "$(cat "$RUNNER_TEMP/krita.pid")" 2>/dev/null || exit 1
            kill -0 "$(cat "$RUNNER_TEMP/blender-tunnel.pid")" 2>/dev/null || exit 1
            kill -0 "$(cat "$RUNNER_TEMP/krita-tunnel.pid")" 2>/dev/null || exit 1
            sleep 30
          done

      - name: Dump complete logs
        if: always()
        run: |
          echo "===== BLENDER ====="
          cat "$RUNNER_TEMP/blender.log" 2>/dev/null || true
          echo "===== KRITA ====="
          cat "$RUNNER_TEMP/krita.log" 2>/dev/null || true
          echo "===== XVFB ====="
          cat "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true
          echo "===== BLENDER TUNNEL ====="
          cat "$RUNNER_TEMP/blender-tunnel.log" 2>/dev/null || true
          echo "===== KRITA TUNNEL ====="
          cat "$RUNNER_TEMP/krita-tunnel.log" 2>/dev/null || true
