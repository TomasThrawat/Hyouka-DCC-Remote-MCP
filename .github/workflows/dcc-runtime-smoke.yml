name: DCC Runtime Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dcc-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Runtime smoke marker
        run: echo "DCC_RUNTIME_SMOKE_REVISION=2026-10-01-14-45"

      - name: Install system dependencies
        run: |
          set -Eeuo pipefail
          timeout 300s sudo apt-get update
          timeout 600s sudo apt-get install -y --no-install-recommends             ca-certificates curl python3-venv python3-pip xz-utils xvfb dbus-x11             krita python3-pyqt5 x11-xkb-utils             libx11-6 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0             libgl1 libglu1-mesa libsm6 libice6 libdbus-1-3             libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-render-util0             libxcb-shape0 libxcb-randr0 libxcb-image0 libxcb-util1             libxkbcommon-x11-0 libegl1 fonts-dejavu
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python providers
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/dcc-smoke-venv"
          "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install --upgrade pip
          timeout 600s "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install             "fastmcp>=2,<4" "httpx>=0.27,<1" "aiohttp>=3.11,<4"             "PyJWT[crypto]>=2.9,<3" "dcc-mcp-krita==0.3.0"
          mkdir -p "$RUNNER_TEMP/dcc-python"
          timeout 600s "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install             --target "$RUNNER_TEMP/dcc-python" "dcc-mcp-blender==0.2.9"

      - name: Install Blender
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          timeout 600s curl -fL --retry 5 --retry-all-errors             "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"             -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install Krita plugin files
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python" - <<'PY'
          from dcc_mcp_krita.install import install
          print("KRITA_INSTALL=" + str(install()))
          PY

      - name: Start DCC hosts
        run: |
          set -Eeuo pipefail
          export DCC_PYTHON_PATH="$RUNNER_TEMP/dcc-python"
          export DCC_PROXY_PYTHON="$RUNNER_TEMP/dcc-smoke-venv/bin/python"
          export DCC_MCP_KRITA_ALLOWED_ROOTS="$GITHUB_WORKSPACE"
          export DCC_MCP_KRITA_BRIDGE_PORT=3848
          unset PYTHONPATH

          export PORT=10000
          export DCC_MCP_INNER_PORT=10002
          "$RUNNER_TEMP/blender/blender" --background             --python "$GITHUB_WORKSPACE/blender/entrypoint.py"             >"$RUNNER_TEMP/blender.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/blender.pid"

          export DISPLAY=:99
          export PORT=10001
          export DCC_MCP_INNER_PORT=10003
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python"             "$GITHUB_WORKSPACE/krita/entrypoint.py"             >"$RUNNER_TEMP/krita.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/krita.pid"

      - name: Wait for advertised endpoints
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 120); do
            if grep -q 'MCP_URL=' "$RUNNER_TEMP/blender.log" &&                grep -q 'KRITA_MCP_URL=' "$RUNNER_TEMP/krita.log"; then
              echo "ADVERTISE=PASS"
              exit 0
            fi
            kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null || {
              echo "BLENDER_DIED"
              cat "$RUNNER_TEMP/blender.log" || true
              exit 1
            }
            kill -0 "$(cat "$RUNNER_TEMP/krita.pid")" 2>/dev/null || {
              echo "KRITA_DIED"
              cat "$RUNNER_TEMP/krita.log" || true
              exit 1
            }
            sleep 1
          done
          echo "ADVERTISE=FAIL"
          cat "$RUNNER_TEMP/blender.log" || true
          cat "$RUNNER_TEMP/krita.log" || true
          exit 1

      - name: MCP JSON or SSE tools/list
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python" - <<'PY'
          import json
          import urllib.request

          P = "2025-03-26"

          def call(url, method, ident, session=None):
              payload = {
                  "jsonrpc": "2.0",
                  "id": ident,
                  "method": method,
                  "params": {} if method == "tools/list" else {
                      "protocolVersion": P,
                      "capabilities": {},
                      "clientInfo": {"name": "dcc-runtime-smoke", "version": "1"},
                  },
              }
              headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream",
                  "Mcp-Protocol-Version": P,
              }
              if session:
                  headers["Mcp-Session-Id"] = session
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.status, response.headers, response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  raise RuntimeError(f"HTTP {error.code}: {body}") from error

          def extract(text):
              text = text.strip()
              for line in text.splitlines():
                  if line.startswith("data: "):
                      obj = json.loads(line[6:])
                      if "error" in obj:
                          raise RuntimeError(obj["error"])
                      if "result" in obj:
                          return obj["result"]
              obj = json.loads(text)
              if "error" in obj:
                  raise RuntimeError(obj["error"])
              if "result" in obj:
                  return obj["result"]
              raise RuntimeError(f"no JSON-RPC result: {text[:1000]}")

          for port, label, minimum in [(10002, "BLENDER", 80), (10003, "KRITA", 15)]:
              url = f"http://127.0.0.1:{port}/mcp"
              status, headers, text = call(url, "initialize", 1)
              print(f"{label}_INITIALIZE_STATUS={status}")
              session = headers.get("Mcp-Session-Id") or headers.get("mcp-session-id")
              extract(text)
              status, _, text = call(url, "tools/list", 2, session)
              print(f"{label}_TOOLS_LIST_STATUS={status}")
              payload = extract(text)
              names = sorted(t.get("name", "") for t in payload.get("tools", []))
              print(f"{label}_TOOLS={len(names)}")
              print(f"{label}_TOOLS_SAMPLE={names[:20]}")
              assert len(names) >= minimum, f"{label}: {len(names)} < {minimum}"
          PY

      - name: Dump logs
        if: always()
        run: |
          echo "=== blender.log ==="
          cat "$RUNNER_TEMP/blender.log" || true
          echo "=== krita.log ==="
          cat "$RUNNER_TEMP/krita.log" || true
