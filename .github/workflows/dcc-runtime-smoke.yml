name: DCC Runtime Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dcc-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Runtime smoke marker
        run: echo "DCC_RUNTIME_SMOKE_REVISION=2026-10-01-14-45"

      - name: Install system dependencies
        run: |
          set -Eeuo pipefail
          timeout 600s sudo apt-get update -o Acquire::Retries=5
          timeout 1200s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o DPkg::Lock::Timeout=120             ca-certificates curl python3-venv python3-pip xz-utils xvfb dbus-x11             krita python3-pyqt5 x11-xkb-utils             libx11-6 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0             libgl1 libglu1-mesa libsm6 libice6 libdbus-1-3             libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-render-util0             libxcb-shape0 libxcb-randr0 libxcb-image0 libxcb-util1             libxkbcommon-x11-0 libegl1 fonts-dejavu
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python providers
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/dcc-smoke-venv"
          "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install --upgrade pip
          timeout 600s "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install             "fastmcp>=2,<4" "httpx>=0.27,<1" "aiohttp>=3.11,<4"             "PyJWT[crypto]>=2.9,<3" "dcc-mcp-krita==0.3.0"
          mkdir -p "$RUNNER_TEMP/dcc-python"
          timeout 600s "$RUNNER_TEMP/dcc-smoke-venv/bin/pip" install             --target "$RUNNER_TEMP/dcc-python" "dcc-mcp-blender==0.2.9"

      - name: Install Blender
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          timeout 600s curl -fL --retry 5 --retry-all-errors             "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"             -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install Krita plugin files
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python" - <<'PY'
          from dcc_mcp_krita.install import install
          print("KRITA_INSTALL=" + str(install()))
          PY

      - name: Repair Krita plugin desktop metadata
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ.get("XDG_DATA_HOME", Path.home() / ".local" / "share"))
          desktop = root / "krita" / "pykrita" / "dcc_mcp_krita.desktop"
          text = desktop.read_text(encoding="utf-8")
          lines = []
          seen = False
          for line in text.splitlines():
              if line.startswith("X-KDE-Library="):
                  if not seen:
                      lines.append("X-KDE-Library=dcc_mcp_krita")
                      seen = True
                  continue
              lines.append(line)
          if not seen:
              marker = "X-KDE-ServiceTypes=Krita/PythonPlugin"
              if marker not in lines:
                  raise RuntimeError("Krita plugin desktop metadata missing X-KDE-ServiceTypes")
              lines.insert(lines.index(marker) + 1, "X-KDE-Library=dcc_mcp_krita")
          desktop.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("KRITA_PLUGIN_DESKTOP_MODULE=dcc_mcp_krita")
          PY

          export DCC_MCP_KRITA_CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/kritarc"

      - name: Canonicalize Krita Python plugin desktop metadata
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ.get('XDG_DATA_HOME', Path.home() / '.local' / 'share'))
          desktop = root / 'krita' / 'pykrita' / 'dcc_mcp_krita.desktop'
          text = desktop.read_text(encoding='utf-8')
          lines = []
          for line in text.splitlines():
              if line.startswith('X-KDE-ServiceTypes=') or line.startswith('ServiceTypes='):
                  continue
              if line.startswith('X-KDE-Library='):
                  continue
              lines.append(line)
          lines.insert(1, 'ServiceTypes=Krita/PythonPlugin')
          lines.insert(2, 'X-KDE-Library=dcc_mcp_krita')
          desktop.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('KRITA_CANONICAL_DESKTOP_METADATA=PASS')
          PY

      - name: Install Krita plugin into system resource path
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          data_root = Path(os.environ.get("XDG_DATA_HOME", Path.home() / ".local" / "share"))
          user_root = data_root / "krita" / "pykrita"
          system_root = Path("/usr/share/krita/pykrita")
          system_root.mkdir(parents=True, exist_ok=True)

          module = user_root / "dcc_mcp_krita"
          desktop = user_root / "dcc_mcp_krita.desktop"
          if not module.is_dir() or not desktop.is_file():
              raise RuntimeError(f"Krita plugin install missing under {user_root}")

          subprocess.run(["sudo","cp","-a",str(module),str(system_root / module.name)],check=True)
          subprocess.run(["sudo","cp","-f",str(desktop),str(system_root / desktop.name)],check=True)
          text = (system_root / desktop.name).read_text(encoding="utf-8")
          if "X-KDE-Library=dcc_mcp_krita" not in text:
              lines = []
              inserted = False
              for line in text.splitlines():
                  lines.append(line)
                  if line == "X-KDE-ServiceTypes=Krita/PythonPlugin":
                      lines.append("X-KDE-Library=dcc_mcp_krita")
                      inserted = True
              if not inserted:
                  raise RuntimeError("System Krita desktop file missing X-KDE-ServiceTypes")
              (system_root / desktop.name).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("KRITA_SYSTEM_PLUGIN=/usr/share/krita/pykrita/dcc_mcp_krita")
          PY
          export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
          export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"

      - name: Start DCC hosts
        run: |
          set -Eeuo pipefail
          export DCC_PYTHON_PATH="$RUNNER_TEMP/dcc-python"
          export DCC_PROXY_PYTHON="$RUNNER_TEMP/dcc-smoke-venv/bin/python"
          export DCC_MCP_KRITA_ALLOWED_ROOTS="$GITHUB_WORKSPACE"
          export DCC_MCP_KRITA_BRIDGE_PORT=3848
          unset PYTHONPATH

          export PORT=10000
          export DCC_MCP_INNER_PORT=10002
          "$RUNNER_TEMP/blender/blender" --background             --python "$GITHUB_WORKSPACE/blender/entrypoint.py"             >"$RUNNER_TEMP/blender.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/blender.pid"

          export DISPLAY=:99
          export PORT=10001
          export DCC_MCP_INNER_PORT=10003
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python"             "$GITHUB_WORKSPACE/krita/entrypoint.py"             >"$RUNNER_TEMP/krita.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/krita.pid"

      - name: Wait for advertised endpoints
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 120); do
            if grep -q 'MCP_URL=' "$RUNNER_TEMP/blender.log" &&                grep -q 'KRITA_MCP_URL=' "$RUNNER_TEMP/krita.log"; then
              echo "ADVERTISE=PASS"
              exit 0
            fi
            kill -0 "$(cat "$RUNNER_TEMP/blender.pid")" 2>/dev/null || {
              echo "BLENDER_DIED"
              cat "$RUNNER_TEMP/blender.log" || true
              exit 1
            }
            kill -0 "$(cat "$RUNNER_TEMP/krita.pid")" 2>/dev/null || {
              echo "KRITA_DIED"
              cat "$RUNNER_TEMP/krita.log" || true
              exit 1
            }
            sleep 1
          done
          echo "ADVERTISE=FAIL"
          cat "$RUNNER_TEMP/blender.log" || true
          cat "$RUNNER_TEMP/krita.log" || true
          exit 1

      - name: FastMCP client tool catalog
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/dcc-smoke-venv/bin/python" - <<'PY'
          import asyncio
          from fastmcp import Client

          async def main():
              async with Client("http://127.0.0.1:10002/mcp") as c:
                  tools = await c.list_tools()
                  print("BLENDER_TOOLS=" + str(len(tools)))
                  assert len(tools) >= 80, f"Blender tools: {len(tools)} < 80"
              async with Client("http://127.0.0.1:10003/mcp") as c:
                  tools = await c.list_tools()
                  print("KRITA_TOOLS=" + str(len(tools)))
                  assert len(tools) >= 15, f"Krita tools: {len(tools)} < 15"

          asyncio.run(main())
          PY
      - name: Dump logs
        if: always()
        run: |
          echo "=== blender.log ==="
          cat "$RUNNER_TEMP/blender.log" || true
          echo "=== krita.log ==="
          cat "$RUNNER_TEMP/krita.log" || true
